apiVersion: v1
kind: Namespace
metadata:
  name: namespace-watch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-watch
  namespace: namespace-watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-watch
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas", "serviceaccounts"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-watch
subjects:
  - kind: ServiceAccount
    name: namespace-watch
    namespace: namespace-watch
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: namespace-watch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namespace-watch
  namespace: namespace-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: namespace-watch
  template:
    metadata:
      labels:
        app: namespace-watch
    spec:
      serviceAccountName: namespace-watch
      containers:
        - name: namespace-watch
          image: namespace-watch:latest
          args:
            - -v=2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
