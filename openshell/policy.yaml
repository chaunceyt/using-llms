version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null


network_policies:
  anthropic:
    name: openshell-demo
    endpoints:
      - { host: 192.168.4.24, port: 8889, protocol: rest, enforcement: enforce, access: full }
      - { host: github.com, port: 443 }
      - { host: release-assets.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: go.dev, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: dl.google.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: proxy.golang.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
      - { host: sum.golang.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/git
      - path: /usr/bin/node
      - path: /usr/local/bin/node
      - path: /sandbox/bin/kubebuilder
      - path: /usr/bin/curl
      - path: /sandbox/opt/go/bin/go

process:
  run_as_user: sandbox
  run_as_group: sandbox
